[project]
name = "fraud-detection-portfolio"
version = "0.1.0"
description = "End-to-end credit-card fraud detection on 13.3M synthetic transactions: supervised model, unsupervised anomaly extension, and an analytics dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39", "plotly>=5.24"]
explain = ["shap>=0.46"]
serve = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]
unsupervised = ["imbalanced-learn>=0.12"]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
